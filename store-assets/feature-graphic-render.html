<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1024px; height: 500px; overflow: hidden; }
  body {
    background: linear-gradient(135deg, #0b0f10 0%, #101415 45%, #01696f 140%);
    position: relative;
    display: flex; align-items: center;
    padding: 0 64px;
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
  }
  .glow1, .glow2 { position: absolute; border-radius: 50%; filter: blur(70px); }
  .glow1 { width: 340px; height: 340px; background: rgba(0,227,253,0.18); top: -120px; right: 120px; }
  .glow2 { width: 260px; height: 260px; background: rgba(133,211,218,0.14); bottom: -110px; right: 340px; }

  .left { position: relative; z-index: 2; max-width: 600px; }
  .badge {
    display: inline-flex; align-items: center; gap: 8px;
    border: 1px solid rgba(255,255,255,0.16);
    background: rgba(15,23,42,0.6);
    padding: 8px 16px; border-radius: 100px;
    font-size: 13px; font-weight: 700; letter-spacing: 2px;
    color: #bdf4ff; margin-bottom: 22px;
  }
  h1 {
    font-size: 62px; font-weight: 800; letter-spacing: -1.5px;
    color: #e0e3e5; line-height: 1.05; margin-bottom: 16px;
  }
  h1 .accent { color: #85d3da; }
  p { font-size: 21px; color: #bec8c9; line-height: 1.45; font-weight: 500; margin-bottom: 26px; }
  .features { display: flex; gap: 12px; }
  .chip {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(133,211,218,0.28);
    color: #bdf4ff; font-size: 14px; font-weight: 700;
    padding: 9px 16px; border-radius: 10px; white-space: nowrap;
  }

  .right {
    position: absolute; right: 74px; top: 50%; transform: translateY(-50%);
    z-index: 2; text-align: center;
  }
  .ring-wrap { position: relative; width: 230px; height: 230px; }
  .ring-center {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .score { font-size: 62px; font-weight: 800; color: #78d8a8; line-height: 1; }
  .outof { font-size: 15px; color: #889393; font-weight: 700; margin-top: 4px; }
  .ring-label { margin-top: 16px; font-size: 13px; font-weight: 800; letter-spacing: 1.6px; color: #bec8c9; }
</style>
</head>
<body>
  <div class="glow1"></div>
  <div class="glow2"></div>

  <div class="left">
    <div class="badge">AI NUTRITION SCANNER</div>
    <h1>Snap. Track.<br><span class="accent">Thrive.</span></h1>
    <p>Instant calories &amp; macros from a photo —<br>plus health scores for packaged foods.</p>
    <div class="features">
      <div class="chip">AI Meal Scan</div>
      <div class="chip">Label Health Score</div>
      <div class="chip">Macro Tracking</div>
    </div>
  </div>

  <div class="right">
    <div class="ring-wrap">
      <svg width="230" height="230" viewBox="0 0 230 230">
        <circle cx="115" cy="115" r="103" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="20"/>
        <circle cx="115" cy="115" r="103" fill="none" stroke="#78d8a8" stroke-width="20"
                stroke-linecap="round"
                stroke-dasharray="647.2" stroke-dashoffset="116.5"
                transform="rotate(-90 115 115)"/>
      </svg>
      <div class="ring-center">
        <div class="score">82</div>
        <div class="outof">/ 100</div>
      </div>
    </div>
    <div class="ring-label">HEALTH SCORE</div>
  </div>
</body>
</html>
