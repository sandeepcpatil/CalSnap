name: Build Android AAB

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-android.yml'

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # The repo uses npm lockfiles everywhere; installing the EAS CLI with the
      # action's default (yarn) is what failed on the last two runs.
      - name: Setup Expo & EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Patch expo-modules-core for AGP 8.3+ compatibility
        working-directory: mobile
        run: |
          PLUGIN="node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle"
          if [ -f "$PLUGIN" ]; then
            # AGP 8.3+ removed project.android.finalizeDsl — replace with androidComponents
            sed -i 's/project\.android\.finalizeDsl/project.androidComponents.finalizeDsl/g' "$PLUGIN"
            # AGP 8.3+ renamed applicationIdSuffix accessor
            sed -i 's/\.applicationIdSuffix\.get()/.applicationIdSuffix.orNull ?: ""/g' "$PLUGIN"
            echo "Patched: $PLUGIN"
            grep -n "finalizeDsl\|applicationIdSuffix" "$PLUGIN" || echo "No remaining incompatible lines found"
          else
            echo "Plugin file not found, skipping patch"
          fi

      # app.config.js is the single source of truth for versionCode.
      # android/app/build.gradle reads it from EXPO_PUBLIC_VERSION_CODE.
      - name: Read versionCode from app.config.js
        id: vc
        working-directory: mobile
        run: |
          VC="$(node -p "require('./app.config.js').android.versionCode")"
          echo "versionCode = $VC"
          echo "VERSION_CODE=$VC" >> "$GITHUB_OUTPUT"

      # Fail closed: an AAB built without these would ship with Google sign-in
      # and RevenueCat unconfigured. Values are never printed.
      - name: Check required public config is present
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_BACKEND_URL: ${{ secrets.EXPO_PUBLIC_BACKEND_URL }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          EXPO_PUBLIC_REVENUECAT_ANDROID_KEY: ${{ secrets.EXPO_PUBLIC_REVENUECAT_ANDROID_KEY }}
        run: |
          MISSING=0
          for VAR in EXPO_PUBLIC_SUPABASE_URL EXPO_PUBLIC_SUPABASE_ANON_KEY EXPO_PUBLIC_BACKEND_URL EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID EXPO_PUBLIC_REVENUECAT_ANDROID_KEY; do
            if [ -z "${!VAR}" ]; then
              echo "::error::Repository secret $VAR is not set (Settings → Secrets and variables → Actions)"
              MISSING=1
            fi
          done
          exit $MISSING

      - name: Build Android AAB (local)
        working-directory: mobile
        run: eas build --platform android --profile production --local --non-interactive --output ./calsnap.aab
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          EXPO_PUBLIC_VERSION_CODE: ${{ steps.vc.outputs.VERSION_CODE }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_BACKEND_URL: ${{ secrets.EXPO_PUBLIC_BACKEND_URL }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          EXPO_PUBLIC_REVENUECAT_ANDROID_KEY: ${{ secrets.EXPO_PUBLIC_REVENUECAT_ANDROID_KEY }}

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: calsnap-android-v${{ steps.vc.outputs.VERSION_CODE }}
          path: mobile/calsnap.aab
          retention-days: 7
